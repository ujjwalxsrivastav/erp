name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze lib/features/school/ lib/services/

      - name: Build Flutter Web
        run: >
          flutter build web --release --base-href /erp/
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://rvyzfqffjgwadxtbiuvr.supabase.co' }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2eXpmcWZmamd3YWR4dGJpdXZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NDkwMzAsImV4cCI6MjA3OTEyNTAzMH0.focrBupRcbCiPgSCRvRpBpzZnvte9hNkWmsD4LSTBN0' }}"

      - name: Verify Web Build Artifact
        run: test -d build/web && test -f build/web/index.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true

