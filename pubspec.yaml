name: erp
description: Complete ERP System for Shivalik College
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Dependencies
  cupertino_icons: ^2.0.0
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State Management
  flutter_riverpod: ^3.5.0
  
  # Routing
  go_router: ^18.1.4
  
  # Local Storage
  shared_preferences: ^2.3.3
  
  # Environment Variables
  flutter_dotenv: ^6.0.2
  
  # Security
  crypto: ^3.0.6
  device_info_plus: ^13.3.0
  
  # Image Handling
  cached_network_image: ^4.0.7
  image_picker: ^1.0.4
  
  # File Handling
  file_picker: ^13.4.0
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Charts & Analytics
  fl_chart: ^1.3.1
  
  # Date & Time
  intl: ^0.20.3
  
  # UI Enhancements
  shimmer: ^4.0.0
  lottie: ^3.0.0
  animations: ^3.0.0
  badges: ^4.0.1
  
  # QR & Barcode
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  
  # Excel Export
  excel: ^4.0.2
  
  # CSV Parser
  csv: ^8.0.0
  
  # Calendar
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^35.2.12
  
  # HTTP
  http: ^1.1.0
  
  # Path Provider
  path_provider: ^2.1.1
  
  # URL Launcher
  url_launcher: ^6.2.1
  
  # Flutter SVG
  flutter_svg: ^2.0.9
  
  # Payment Gateway
  razorpay_flutter: ^1.3.7


dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
